<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0f0c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="S50" />
  <title>S50 · KSPO 스트렉스 트래커</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{ink:"#0a0f0c",panel:"#121a15",line:"#1e2b23",lime:"#b6ff3b"}}}}</script>
  <style>
    html,body{background:#0a0f0c}
    @keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
    .pop{animation:pop .45s ease-out}
    @keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(182,255,59,.45)}100%{box-shadow:0 0 0 16px rgba(182,255,59,0)}}
    .ringon{animation:pulseRing 1s ease-out}
    .m-off{fill:url(#gOff);stroke:#2a3330;stroke-width:.35}
    .m-peak{fill:url(#gPeak);stroke:#f6ffc4;stroke-width:.45;filter:drop-shadow(0 0 6px rgba(180,255,90,.55))}
    .m-pri{fill:url(#gPri);stroke:#9dff7a;stroke-width:.4;filter:drop-shadow(0 0 4px rgba(62,224,160,.4))}
    .m-sec{fill:url(#gSec);stroke:#4aa88a;stroke-width:.35}
    .m-ter{fill:url(#gTer);stroke:#3a6a58;stroke-width:.3}
    .m-bone{fill:url(#gBone);stroke:#3a4440;stroke-width:.4}
    .body-svg{width:100%;height:auto}
    .body-svg [data-m]{cursor:pointer}
    .max-w-md{max-width:28rem}.mx-auto{margin-left:auto;margin-right:auto}
    .min-h-dvh{min-height:100dvh}.pb-24{padding-bottom:6rem}.pt-5{padding-top:1.25rem}
    .px-1{padding-left:.25rem;padding-right:.25rem}.px-2{padding-left:.5rem;padding-right:.5rem}
    .px-3{padding-left:.75rem;padding-right:.75rem}.px-4{padding-left:1rem;padding-right:1rem}
    .py-1{padding-top:.25rem;padding-bottom:.25rem}.py-2{padding-top:.5rem;padding-bottom:.5rem}
    .py-3{padding-top:.75rem;padding-bottom:.75rem}
    .p-2{padding:.5rem}.p-3{padding:.75rem}.p-4{padding:1rem}.p-5{padding:1.25rem}.p-6{padding:1.5rem}
    .pb-3{padding-bottom:.75rem}.pl-4{padding-left:1rem}.pr-2{padding-right:.5rem}
    .mt-1{margin-top:.25rem}.mt-2{margin-top:.5rem}.mt-3{margin-top:.75rem}.mt-4{margin-top:1rem}.mt-5{margin-top:1.25rem}
    .mb-1{margin-bottom:.25rem}.mb-2{margin-bottom:.5rem}.mb-3{margin-bottom:.75rem}.mb-4{margin-bottom:1rem}
    .flex{display:flex}.flex-1{flex:1}.flex-col{flex-direction:column}.flex-wrap{flex-wrap:wrap}
    .grid{display:grid}.grid-cols-2{grid-template-columns:1fr 1fr}.grid-cols-3{grid-template-columns:1fr 1fr 1fr}
    .grid-cols-7{grid-template-columns:repeat(7,1fr)}
    .gap-1{gap:.25rem}.gap-2{gap:.5rem}.gap-x-3{column-gap:.75rem}.gap-y-1{row-gap:.25rem}
    .items-center{align-items:center}.items-end{align-items:flex-end}.items-start{align-items:flex-start}
    .justify-between{justify-content:space-between}.justify-center{justify-content:center}
    .text-left{text-align:left}.text-center{text-align:center}.text-right{text-align:right}
    .font-black{font-weight:800}.font-bold{font-weight:700}.underline{text-decoration:underline}
    .leading-tight{line-height:1.2}.leading-relaxed{line-height:1.6}
    .tracking-widest{letter-spacing:.2em}.tabular-nums{font-variant-numeric:tabular-nums}
    .text-xs{font-size:12px}.text-sm{font-size:14px}.text-lg{font-size:18px}
    .text-2xl{font-size:24px}.text-4xl{font-size:36px}.text-5xl{font-size:48px}
    .text-\[10px\]{font-size:10px}.text-\[11px\]{font-size:11px}
    .text-zinc-100{color:#f4f4f5}.text-zinc-300{color:#d4d4d8}.text-zinc-400{color:#a1a1aa}
    .text-zinc-500{color:#71717a}.text-lime{color:#b6ff3b}.text-ink{color:#0a0f0c}.text-red-300{color:#fca5a5}
    .bg-panel{background:#121a15}.bg-ink{background:#0a0f0c}.bg-lime{background:#b6ff3b}
    .bg-line{background:#1e2b23}.bg-\[\#0e1511\]{background:#0e1511}.bg-black\/70{background:rgba(0,0,0,.7)}
    .bg-ink\/60{background:rgba(10,15,12,.6)}
    .border{border:1px solid #1e2b23}.border-line{border-color:#1e2b23}.border-lime{border-color:#b6ff3b}
    .border-t{border-top:1px solid #1e2b23}.border-b{border-bottom:1px solid #1e2b23}
    .rounded-sm{border-radius:2px}.rounded-lg{border-radius:8px}.rounded-xl{border-radius:12px}
    .rounded-2xl{border-radius:16px}.rounded-full{border-radius:999px}.rounded-t-2xl{border-radius:16px 16px 0 0}
    .w-2{width:.5rem}.w-20{width:5rem}.w-72{width:18rem}.w-full{width:100%}
    .h-1\.5{height:6px}.h-2{height:8px}.h-full{height:100%}.min-h-\[16px\]{min-height:16px}
    .overflow-hidden{overflow:hidden}.overflow-auto{overflow:auto}.max-h-\[92dvh\]{max-height:92dvh}
    .fixed{position:fixed}.inset-0{inset:0}.left-0{left:0}.right-0{right:0}.bottom-0{bottom:0}
    .z-20{z-index:20}.z-50{z-index:50}.block{display:block}.inline-block{display:inline-block}
    .list-disc{list-style:disc}.space-y-1>*>+*{margin-top:.25rem}.space-y-2>*>+*{margin-top:.5rem}
    .space-y-3>*>+*{margin-top:.75rem}
    button,input{font:inherit;color:inherit}
    input{background:#0a0f0c;border:1px solid #1e2b23;border-radius:8px;padding:.5rem .75rem}
    button{cursor:pointer;background:none;border:0}
  </style>
</head>
<body class="text-zinc-100 antialiased max-w-md mx-auto min-h-dvh pb-24">
  <div id="app"></div>
  <script src="./app1.js"></script>
  <script src="./app2.js"></script>
  <script src="./app3.js"></script>
</body>
</html>
